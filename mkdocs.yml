site_name: Sericon
site_description: A shared serial terminal for Linux, with formulas and embedded Linux file tools.
site_url: https://sericon.xyz/
repo_url: https://github.com/digitalandrew/sericon
repo_name: digitalandrew/sericon
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Andrew Bellini · MIT license
docs_dir: docs
site_dir: .local/docs-site
strict: true
exclude_docs: |
  /session-handoff.md
  /requirements.md
  /hardware-validation.md
  /hooks.py
  /__pycache__/
theme:
  name: material
  custom_dir: docs-theme
  font: false
  logo: assets/sericon.svg
  favicon: assets/sericon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
plugins:
  - search
hooks:
  - docs/hooks.py
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
extra_css:
  - assets/sericon.css
nav:
  - Sericon: index.md
  - Start:
      - Get started: getting-started.md
      - Install: installation.md
      - Beta scope: beta.md
  - Serial sessions:
      - Terminal controls: terminal.md
      - Search history: search.md
      - Configuration: configuration.md
      - Sessions and logging: sessions.md
  - Embedded Linux:
      - Files: files.md
      - Optional helper: helper.md
  - Automation:
      - Formulas: formulas.md
      - Formula API: formula-reference.md
      - AI tools and MCP: ai-tools.md
  - Reference:
      - Troubleshooting: troubleshooting.md
      - Local session API: local-api.md
      - Development: development.md
      - Third-party components: third-party.md
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
